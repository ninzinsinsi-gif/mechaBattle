let SKY=null;
async function skyLoad(){if(window.skyway_room)return;for(const u of['https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js','https://unpkg.com/@skyway-sdk/room/dist/skyway_room-latest.js']){try{await new Promise((ok,ng)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=ng;document.head.appendChild(e)});if(window.skyway_room)return}catch(e){}}throw new Error('SkyWay SDKを読み込めません')}

async function skyJoin(name){const ctx=await skyCtx(),{SkyWayRoom,SkyWayStreamFactory,uuidV4}=skyway_room;
const room=await SkyWayRoom.FindOrCreate(ctx,{type:'p2p',name}),me=await room.join({name:uuidV4?uuidV4():crypto.randomUUID()}),ds=await SkyWayStreamFactory.createDataStream();await me.publish(ds);

const notify=()=>{const list=Object.keys(peers).map(k=>peers[k]);pl.forEach(f=>{try{f({peers:list,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})};
const send=(t,d)=>{if(!alive)return;try{ds.write(JSON.stringify({t,d}))}catch(e){}};
const sub=async pub=>{if(pub.publisher.id===me.id||pub.contentType!=='data')return;try{const {stream}=await me.subscribe(pub.id),pid=pub.publisher.id;peers[pid]=peers[pid]||{peer:pid,isMe:false,sameTab:false,kind:'viewer',presence:{}};
stream.onData.add(raw=>{let m;try{m=JSON.parse(raw)}catch(e){return}if(!m||typeof m.t!=='string')return;if(m.t==='_p'){peers[pid].presence=m.d||{};notify()}else fire(m.t,m.d,false)});send('_p',mine);notify()}catch(e){console.error(e)}};
room.publications.forEach(sub);room.onStreamPublished.add(e=>sub(e.publication));
room.onMemberLeft.add(e=>{delete peers[e.member.id];notify()});
const iv=setInterval(()=>send('_p',mine),1500);
return{emit:async(t,d)=>{send(t,d);fire(t,d,true)},on:(t,f)=>{(hs[t]=hs[t]||[]).push(f);return()=>{hs[t]=hs[t].filter(x=>x!==f)}},presence:async p=>{Object.assign(mine,p);send('_p',mine)},onPeers:f=>{pl.push(f);setTimeout(notify,0);return()=>{}},leave:async()=>{alive=false;clearInterval(iv);try{await me.leave()}catch(e){}try{await room.dispose()}catch(e){}}}}
